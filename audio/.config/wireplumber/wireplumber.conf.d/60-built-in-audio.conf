# Force Built-in Audio to Analog Stereo and set as high priority for Desktop.
# This prevents the system from defaulting to HDMI on startup.
#
# Device: HDA Intel PCH (pci-0000_00_1f.3)

monitor.alsa.rules = [
  {
    matches = [
      { device.name = "alsa_card.pci-0000_00_1f.3" }
    ]
    actions = {
      update-props = {
        device.profile = "pro-audio"
      }
    }
  },
  {
    matches = [
      { node.name = "~alsa_output\\.pci-0000_00_1f\\.3\\.analog-stereo" }
    ]
    actions = {
      update-props = {
        priority.session = 2000
      }
    }
  }
]
