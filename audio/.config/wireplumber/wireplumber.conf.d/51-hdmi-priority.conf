# Prefer HDMI/DisplayPort audio over the built-in analog output. Z13 only.
#
# Stock ALSA priorities rank the built-in analog sink (priority.session 1009)
# above HDMI (632). When the external display is unplugged its sink disappears
# and WirePlumber falls back to analog, which is correct; but on reconnect the
# higher-priority analog sink keeps winning, so sound stays on laptop speakers.
# Raising the HDMI outputs above analog makes the display the preferred sink
# again as soon as it comes back.
#
# The match is pinned to the Z13's Radeon audio card (pci-0000_c4_00.1) rather
# than to HDMI generally, so this rule cannot take effect on another host even
# if the `audio` package is stowed there. The desktop in particular drives sink
# selection through shared/.config/shared/scripts/cycle-audio-source.sh and must
# not have a static priority override competing with it.
#
# Only priority.session is set. That is the value the default-node picker uses.
# priority.driver is left alone so HDMI does not also become the graph clock.

monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output\\.pci-0000_c4_00\\.1\\.hdmi.*" }
    ]
    actions = {
      update-props = {
        priority.session = 1500
      }
    }
  }
]
