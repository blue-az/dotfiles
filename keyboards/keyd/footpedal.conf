# keyd: the PCsensor FootSwitch (USB 1a86:e026) sends F13; Sway runs
# pedal-voice on it, which types /voice + Enter (debounced).
#
# The pedal's firmware sends Escape. default.conf matches every keyboard
# ([ids] *), so keyd grabs the pedal too and re-emits its keys from
# keyd_virtual_keyboard; a Sway `bindsym --input-device` for the pedal can
# therefore never match. A config naming the pedal's id is more specific than
# `*`, so keyd uses this file for the pedal instead of default.conf.
#
# Not a keyd macro: keyd cannot ignore a quick second press, and two
# overlapping macros typed "/vovoice". pedal-voice (sway/.local/bin) drops
# presses within 1.5 s. /voice opens rpiv-voice dictation in the focused pi
# session (it listens on the default input, PhoneMic). Keyboard Escape is
# unaffected and still cancels the overlay. Nothing else uses F13.
#
# Install: sudo install -m644 footpedal.conf /etc/keyd/footpedal.conf && sudo keyd reload

[ids]
1a86:e026

[main]
esc = f13
