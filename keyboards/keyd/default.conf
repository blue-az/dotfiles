# keyd: reclaim the ; home-row key as a second Right Ctrl.
#
# This lives at the scancode layer on purpose. The xkb version of this remap
# (target was BackSpace then; see git history for the "semicolon_backspace"
# symbols entry) broke ':' in Chromium: Chromium derives the legacy keyCode/VKEY
# from a key's *unshifted* keysym, so with BackSpace on level 1 every press of
# that key -- shifted or not -- arrived as VKEY_BACK (8). Blink's contenteditable
# handler dispatches on keyCode, so Shift+; deleted a character instead of typing
# ':' in LinkedIn's composer and in any Electron app. Right Ctrl is non-printable
# too, so xkb would fail the same way today.
#
# Remapping below xkb avoids this: keyd emits a real shift+KEY_SEMICOLON, so
# the compositor's (stock US) keymap resolves it normally and Chromium assigns
# VKEY_OEM_1. As a bonus this applies to the i3/X11 session and the TTY too,
# which the Sway-only xkb_file never did.
#
# Only the ; key moves. Its shifted glyph stays exactly where it is, so :
# never leaves the finger that already knows it.
#
# Install: sudo install -m644 default.conf /etc/keyd/default.conf && sudo keyd reload
# Panic:   hold backspace+escape+enter together to terminate keyd.

[ids]
*

[main]
# ; -> Right Ctrl. The real Right Ctrl is untouched.
semicolon = rightcontrol

[shift]
# : stays put -- vim needs it where the fingers expect it.
semicolon = :

[altgr]
# The displaced ; retreats to Right Alt, which is otherwise unused. Left Alt
# is deliberately left alone so application shortcuts keep working.
semicolon = ;
