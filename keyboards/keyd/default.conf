# keyd: reclaim the ; home-row key as a second BackSpace.
#
# This lives at the scancode layer on purpose. The same remap done in xkb
# (see git history for xkb/.config/xkb/symbols/custom "semicolon_backspace")
# broke ':' in Chromium: Chromium derives the legacy keyCode/VKEY from a key's
# *unshifted* keysym, so with BackSpace on level 1 every press of that key --
# shifted or not -- arrived as VKEY_BACK (8). Blink's contenteditable handler
# dispatches on keyCode, so Shift+; deleted a character instead of typing ':'
# in LinkedIn's composer and in any Electron app.
#
# Remapping below xkb avoids this: keyd emits a real shift+KEY_SEMICOLON, so
# the compositor's (stock US) keymap resolves it normally and Chromium assigns
# VKEY_OEM_1. As a bonus this applies to the i3/X11 session and the TTY too,
# which the Sway-only xkb_file never did.
#
# Only the two home-row keys move. The shifted glyphs stay exactly where they
# are, so : and " never leave the fingers they live on.
#
# Install: sudo install -m644 default.conf /etc/keyd/default.conf && sudo keyd reload
# Panic:   hold backspace+escape+enter together to terminate keyd.

[ids]
*

[main]
# ' -> BackSpace, ; -> Right Ctrl. The real BackSpace and Ctrl are untouched.
apostrophe = backspace
semicolon = rightcontrol

[shift]
# : and " stay put -- vim needs them where the fingers expect them.
apostrophe = "
semicolon = :

[alt]
# The two displaced glyphs retreat to Left Alt on their own keys.
apostrophe = '
semicolon = ;
