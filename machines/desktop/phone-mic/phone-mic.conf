# Install as ~/.config/pipewire/pipewire-pulse.conf.d/phone-mic.conf
# A null sink that phone-mic-scrcpy.service plays the phone's mic into, and its
# monitor remapped as an ordinary input named "PhoneMic" (source phone_mic).
pulse.cmd = [
    { cmd = "load-module" args = "module-null-sink sink_name=phonemic sink_properties=device.description=PhoneMicSink" flags = [ "nofail" ] }
    { cmd = "load-module" args = "module-remap-source master=phonemic.monitor source_name=phone_mic source_properties=device.description=PhoneMic" flags = [ "nofail" ] }
]

# Always send scrcpy's playback into phonemic. PULSE_SINK alone is not enough;
# without this the stream follows the default sink. stream.rules, not pulse.rules:
# pulse.rules match the client, stream.rules the stream.
stream.rules = [
    {
        matches = [ { application.name = "scrcpy" } ]
        actions = { update-props = { target.object = "phonemic" } }
    }
]
