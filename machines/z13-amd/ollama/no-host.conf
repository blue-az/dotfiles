[Service]
# Restore the pre-0.32.13 behaviour: keep non-offloaded weights in mmap'd
# CPU_Mapped pages instead of pinned Vulkan_Host buffers. On gfx1151 the
# RADV heap is only VRAM+GTT (~17.5 GiB), and Vulkan_Host weights count
# against it, so a 19 GB model can never fit no matter the layer split.
Environment="LLAMA_ARG_NO_HOST=1"
